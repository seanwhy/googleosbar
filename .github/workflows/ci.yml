# The check every change has to pass: unit tests, lint (known errors in app/lint-baseline.xml) and a release build.
# It needs no secrets: the release build is made without the signing key, so it is unsigned.
#
# No `paths:` filter on either trigger, on purpose. The repository ruleset requires a check named `check`, and a required
# check that does not report (because a filter skipped the run) blocks a merge for good.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The heap comes from gradle.properties. There is no keystore on this runner, so assembleRelease builds unsigned
      # (app/build.gradle.kts signs only when ~/.config/bentobar holds a key); a real release is signed by release.yml.
      # Maven Central and the plugin portal sometimes answer 429, or a lookup comes back as not found, and the same
      # command succeeds a moment later. Retry only that. A failing test is not tried again.
      - name: Tests, lint and release build
        run: |
          set +e
          log=$(mktemp)
          for attempt in 1 2 3; do
            ./gradlew :app:testDebugUnitTest :app:testComposeTestUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && ! grep -q 'There were failing tests' "$log" && grep -qE '429|was not found|Could not GET|Could not resolve|Read timed out|Connection reset' "$log"; then
              echo "Dependency lookup failed (attempt $attempt), retrying in 30s"
              sleep 30
              continue
            fi
            exit "$code"
          done

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
